  # ------------------------------------------------------------------ measured (Phase 3)
  - id: RES-012
    type: real_measured_model_result
    title: "Phase 3 gate 3B: learned visibility estimator accuracy, seen vs held-out family"
    statement: "On p3_test renders the learned VisNet reaches IoU 0.90-0.97 on seen families and transfers to held-out mask / sunglasses / hand-object (IoU 0.90 / 0.87 / 0.89, global MAE 0.012-0.053), but fails on held-out random patch (IoU 0.13, MAE 0.344) and extreme lighting (IoU 0.005, MAE 0.491), where the signed bias equals the MAE (visibility overestimated). The appearance-anomaly heuristic reaches IoU 0.00-0.31 everywhere."
    source: "scripts/evaluate_visibility.py"
    artefact: "reports/experiments/phase3_visibility_eval.json"
    created: "2026-11-01"
    provenance:
      git_commit: "8e317fb7c2aae316d6512c9c2c103018f1a5e712"
      dataset_ids: ["digiface1m"]
      model_ids: ["veilx_visnet_phase3_F1-F5"]
      split: "p3_test"
      protocol_version: "0.5.0"
      final_run_log_entry: "evaluate_visibility.py entries in results/test_runs.jsonl (map accuracy only)"
    caveats: "Synthetic faces and occluders; 5 held-out families only; <=20,000 seeded renders per cell."
  - id: RES-013
    type: real_measured_model_result
    title: "Phase 3 CONFIRMATORY C3: predicted-visibility vs quality-stratified calibration on unseen families"
    statement: "Single logged p3_test run: the predicted-visibility-stratified arm (A4) violates the 5% sFNMR target on held-out random patch (8.52%, CI excludes 5%) while quality stratification (A3, 2.12%) and the ground-truth-visibility oracle (A5, 2.76%) do not; A4 is significantly worse than A3 on 3/5 held-out folds (paired identity jackknife, Holm) for +3.0 pp mean coverage. C3 is NOT supported. Clean-only calibration violates on every held-out family (6.0-19.8%)."
    source: "scripts/evaluate_phase3.py final --final"
    artefact: "reports/experiments/phase3_final.json"
    created: "2026-10-27"
    provenance: &p3_final
      git_commit: "1b81d53bf4e7caf30884cc81f3fddb85c6e49d74"
      dataset_ids: ["digiface1m"]
      model_ids: ["adaface_ir101_webface4m", "arcface_ir101_webface4m", "veilx_visnet_phase3_F1-F5"]
      split: "p3_test"
      protocol_version: "0.5.0"
      final_run_log_entry: "bb5d9244bb3c"
    caveats: "Synthetic faces and occluders; empirical OOD rates, no formal OOD guarantee; v2 ordering (v1 comparison reported)."
  - id: RES-014
    type: real_measured_model_result
    title: "Phase 3 CONFIRMATORY C1 and H4: co-visibility value beyond quality; clean margin"
    statement: "Co-visibility (M4 vs M1) lowers occluded-pair log-loss significantly in 7/10 cells but raises it on held-out random patch (-0.035) and lighting (-0.010), so C1 is NOT supported under the registered rule. The fused model meets the clean 0.5 pp margin in 5/5 folds: clean FNMR 0.68-0.74% (M4) vs 1.12% (M0) at frozen clean-cal FAR-1% thresholds."
    source: "scripts/evaluate_phase3.py final --final"
    artefact: "reports/experiments/phase3_final.json"
    created: "2026-10-27"
    provenance: *p3_final
    caveats: "Synthetic data; MLP fusion (val criterion met in 4/5 folds) not evaluated on test (exploratory, D-047)."
  - id: RES-015
    type: real_measured_model_result
    title: "Phase 3 FOLLOW-UP: frozen Phase 3 rules on Phase 2 DigiFace test and LFW derived occlusions"
    statement: "With no fitting, the confirmatory pattern replicates: on held-out random patch A4 gives sFNMR 8.90% (Phase 2 DigiFace test) and 8.30% (LFW View 2, real photographs with synthetic overlays), versus A3 2.18% / 2.26% and oracle A5 2.77% / 2.20%. On LFW co-visibility features give no log-loss benefit in any family (M1 - M4 = -0.0006 to -0.048)."
    source: "scripts/evaluate_phase3.py followup --final"
    artefact: "reports/experiments/phase3_followup.json"
    created: "2026-11-01"
    provenance:
      git_commit: "8e317fb7c2aae316d6512c9c2c103018f1a5e712"
      dataset_ids: ["digiface1m", "kaggle_jessicali9530_lfw"]
      model_ids: ["adaface_ir101_webface4m", "arcface_ir101_webface4m", "veilx_visnet_phase3_F1-F5"]
      split: "test (Phase 2 test_balanced); lfw_view2"
      protocol_version: "0.5.0"
      final_run_log_entry: "9b660f16061a"
    caveats: "Follow-up evidence (both sets observed in Phase 2; LFW View 2 third use); synthetic occluders."
  - id: RES-016
    type: real_measured_model_result
    title: "Phase 3 EXPLORATORY: detector-inclusive robustness on LFW (occluders composited into photographs)"
    statement: "On 300 LFW View 2 pairs with synthetic occluders inverse-warped into the original photographs and re-detected by SCRFD, detection fails on up to 17.3% (random patch, high), 7.7% (lighting, high) and 3.7% (hand, high) of faces; A4 still violates on random patch (sFNMR 8.49%) while A3 stays within target (3.53%); forced non-match handling of detection failures raises A4 random-patch sFNMR to 13.8%. The learned visibility estimator overestimates visibility after re-alignment (12-pair diagnostic: global MAE 0.066 -> 0.204 mask, 0.003 -> 0.101 sunglasses)."
    source: "scripts/lfw_detector_inclusive.py --final"
    artefact: "reports/experiments/phase3_lfw_detector_inclusive.json"
    created: "2026-11-01"
    provenance:
      git_commit: "8e317fb7c2aae316d6512c9c2c103018f1a5e712"
      dataset_ids: ["kaggle_jessicali9530_lfw"]
      model_ids: ["adaface_ir101_webface4m", "arcface_ir101_webface4m", "veilx_visnet_phase3_F1-F5", "insightface_buffalo_l_det_10g"]
      split: "lfw_view2"
      protocol_version: "0.5.0"
      final_run_log_entry: "6a3c151e18a5; diagnostic diag-detinc-1"
    caveats: "Exploratory; 300 pairs; synthetic occluders; F5 composite re-lights only the crop footprint."
  # ------------------------------------------------------------------ measured (Phase 4)
  - id: RES-017
    type: real_measured_model_result
    title: "Phase 4A root cause of visibility overestimation (development data)"
    statement: "On p3_val renders the Phase 3 estimator misses 88% of occluded face cells of the unseen random-patch family with confident predictions (mean P(visible) 0.85, 67% above 0.9), equally inside and outside the zones of seen occluders, for any patch colour; probes show it calls any uniform fill visible unless such patches were in training, and every model calls another identity's face patch visible. Lighting labels weakly track recognition damage (genuine-score drop correlation -0.31 vs -0.43 to -0.70 for physical occluders)."
    source: "scripts/phase4_diagnose.py"
    artefact: "reports/experiments/phase4_diagnostics.json"
    created: "2026-11-01"
    provenance:
      git_commit: "9ce3bd294cdf79b853232c1e0ad31ae1f2aedc91"
      dataset_ids: ["digiface1m"]
      model_ids: ["veilx_visnet_phase3_F1-F5", "adaface_ir101_webface4m"]
      split: "p3_val (development)"
      protocol_version: "0.6.0"
      final_run_log_entry: "none (development data)"
    caveats: "Synthetic faces and occluders; diagnostics informed the Phase 4 design, so F4/F5 are design-informed in Phase 4."
  - id: RES-018
    type: real_measured_model_result
    title: "Phase 4 CONFIRMATORY: conservative / novelty-aware / hybrid calibration vs quality stratification"
    statement: "On the untouched p4_test partition (DigiFace identities 2000-5999, used once), the conservative (C4), novelty-aware (N4) and quality-first hybrid (H4) arms are all unsafe relative to quality-stratified calibration A3: violations 10 / 9 / 9 vs 6 (10 cells x 2 error types) and significantly worse sFNMR in 8 / 9 / 6 cells (paired identity jackknife, Holm), including every never-seen E1 hair cell. The registered recommendation is A3."
    source: "scripts/evaluate_phase4.py final --final"
    artefact: "reports/experiments/phase4_final.json"
    created: "2026-11-02"
    provenance: &p4_final
      git_commit: "5571872952b78ae05d1078c451519d2e2ef82045"
      dataset_ids: ["digiface1m"]
      model_ids: ["adaface_ir101_webface4m", "arcface_ir101_webface4m", "veilx_visnet_phase3_F1-F5", "veilx_vec_phase4_F1-F5"]
      split: "p4_test"
      protocol_version: "0.6.0"
      final_run_log_entry: "903f6a5c7de3"
    caveats: "Synthetic faces and occluders; F4/F5 design-informed; no OOD guarantee."
  - id: RES-019
    type: real_measured_model_result
    title: "Phase 4: conservative visibility estimator and novelty detection on p4_test"
    statement: "VE-C cuts overestimation on the held-out random patch (share of renders overestimated by >0.10: 94.6% -> 21.9%; bias +0.342 -> +0.065, design-informed) and has negative (conservative) bias on the never-seen E1 hair occluder in 4/5 folds. Mahalanobis novelty reaches AUROC 0.91-0.98 for E1 vs seen-family renders with a realised in-distribution pair flag rate of 4.6-5.2% (registered 5%). Even ground-truth visibility (A5) has higher sFNMR than A3 on every E1 cell."
    source: "scripts/evaluate_phase4.py final --final"
    artefact: "reports/experiments/phase4_final.json"
    created: "2026-11-02"
    provenance: *p4_final
    caveats: "Lighting GT in the evaluation store uses the old darkening definition, so F5 bias is not comparable by design."
  - id: RES-020
    type: real_measured_model_result
    title: "Phase 4: population shift between calibration and p4_test; fusion and co-visibility ablations"
    statement: "Genuine pairs of the 72-image identities in p4_test are ~4x harder than on p3_test (clean FNMR of raw similarity 4.81% vs 1.12%), and every arm, A3 and the oracle included, exceeds the 5% sFNMR target even on seen families (5.4-7.8%), so p3_cal calibration does not transfer to this sub-population. The MLP fused score has lower log-loss than logistic fusion in 9/10 primary cells; removing co-visibility lowers log-loss in 8/10 cells."
    source: "scripts/evaluate_phase4.py final --final"
    artefact: "reports/experiments/phase4_final.json"
    created: "2026-11-02"
    provenance: *p4_final
    caveats: "Population differences (accessories, pose, genuine cap 6) are inferred, not isolated."
  - id: RES-021
    type: real_measured_model_result
    title: "Phase 4 FOLLOW-UP and detector policies"
    statement: "On the calibration-matched p3_test (follow-up), conservative visibility removes the Phase 3 random-patch violation (C4 3.64%, N4 3.14% vs A4 8.52%) but stays significantly worse than A3 on 3 cells. On LFW composites the detector loses up to 32% of high-severity random-patch faces (no face / low quality); the fixed-crop fallback selected on View 1 DevTest keeps every family within target on View 2 (worst sFNMR 3.16%), while forced non-match reaches 14.7-16.1%."
    source: "scripts/evaluate_phase4.py followup --final; scripts/phase4_detector.py"
    artefact: "reports/experiments/phase4_followup_p3test.json"
    created: "2026-11-02"
    provenance:
      git_commit: "9ce3bd294cdf79b853232c1e0ad31ae1f2aedc91"
      dataset_ids: ["digiface1m", "kaggle_jessicali9530_lfw"]
      model_ids: ["adaface_ir101_webface4m", "arcface_ir101_webface4m", "veilx_vec_phase4_F1-F5", "insightface_buffalo_l_det_10g"]
      split: "p3_test; lfw_view1_devtest; lfw_view2"
      protocol_version: "0.6.0"
      final_run_log_entry: "db421cf1744d; d57db3ee8923"
    caveats: "Follow-up evidence (sets observed before); 300 LFW pairs; synthetic occluders."
  - id: RES-022
    type: real_measured_model_result
    title: "Phase 5 application parity with the offline frozen evaluation"
    statement: "The local application reproduces the frozen A3 decisions of the offline Phase 3 evaluation on 1000/1000 p3_val pairs (fold F1; max fused-score difference 0.0025); on 300 LFW View 1 DevTrain images all 244 single-face crops and all 48 explicitly selected central-face crops are pixel-identical to the offline aligned crops (49 multi-face images refused, 7 fallback); CPU fp32 vs GPU fp16 decisions agree on 100/100 pairs (min embedding cosine 0.99991)."
    source: "scripts/phase5_parity.py --n 1000"
    artefact: "reports/experiments/phase5_parity.json"
