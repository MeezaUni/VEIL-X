    statement: "One pair per request, warm medians: total 226 ms on GPU for LFW photographs (SCRFD on CPU 174 ms), 43 ms for pre-aligned crops; CPU-only 509 ms and 303 ms. Model loading about 2.7 s; peak GPU memory 550 MiB; peak process RSS 2.2 GiB with both devices loaded."
