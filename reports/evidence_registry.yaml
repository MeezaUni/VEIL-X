    statement: "SCRFD det_10g (CPU) found a face in 13,195 of 13,233 LFW images (99.71%); 42 of 6,000 View-2 pairs contain an undetected image; 17.5% of images contain several faces; isolated CPU latency p50/p95/p99 = 92/102/111 ms."
