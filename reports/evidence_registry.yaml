    statement: "On real photographs with synthetic overlays, FNMR at the DigiFace threshold is 16.6% for random patch (both backbones) and 0.9-7.7% for the other families; the DigiFace rules calibrated without random patches give sFNMR 7.46% / 5.28% (global) and 9.96% / 7.46% (global v2) against a 5% target on random-patch pairs, while oracle-visibility stratification gives 0.35% / 1.72% at coverage 0.43 / 0.87."
