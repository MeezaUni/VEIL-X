      dataset_ids: ["digiface1m"]
      model_ids: ["adaface_ir101_webface4m", "arcface_ir101_webface4m"]
      split: "val, cal, test (images only)"
      protocol_version: "0.4.0"
      final_run_log_entry: "not applicable (no scores computed)"
