      final_run_log_entry: "1c291322aa27"
    caveats: "Same population type as p4_test (72-image identities); synthetic occluders; replication, not a new population."
  - id: RES-025
    type: real_measured_model_result
    title: "Frozen M1/A3 unreliable below the calibration support of quality"
    statement: "Below the 1st percentile of each fold's calibration quality (~1 % of pairs), the frozen A3 systems have sFMR 18-42 % on p3_val (development) vs 1.1-1.5 % above; synthetic non-face pairs (q 5-10) are decided MATCH with p ~ 1.000 because the logistic M1 extrapolates. On the untouched p6_test (exploratory Amendment 1) the tail (0.9 % of pairs) had A3 sFMR 22.97 % (289/1,258) vs 1.50 % above."
    source: "scripts/phase6_lowq_audit.py; scripts/evaluate_phase4.py final --final --partition p6 (Amendment 1)"
    artefact: "reports/experiments/phase6_lowq_audit.json"
