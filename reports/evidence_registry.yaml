  - id: RES-026
    type: real_measured_model_result
    title: "GPU face detection not available in the project environment"
    statement: "The onnxruntime CUDA execution provider could not be created (onnxruntime-gpu 1.31 needs the CUDA 13 runtime; the environment has CUDA 12.8 via torch); SCRFD fell back to the CPU provider, so the registered adoption rule was not met and the CPU detector (used for every published result) remains the only supported path."
    source: "scripts/phase6_gpu_detector.py"
