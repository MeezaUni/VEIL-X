  - id: RES-024
    type: real_measured_model_result
    title: "Phase 6 pre-registered replication of the population-shift failure and of the A3 recommendation"
    statement: "On 4,000 untouched 72-image DigiFace identities (parts 6000-9999), the frozen Phase 3/4 systems reproduced the Phase 4 findings: A3's sFNMR 95 % CI excluded the 5 % target in 4/5 seen-family (Test-ID) cells (5.15-6.49 %; R1, criterion >= 3); no candidate was safe relative to A3 (violations A3 7, C4 10, N4 10, H4 9; R2, recommendation A3); A3 sFMR was within target in all 15 cells (1.20-2.77 %; R3). Clean FNMR of raw similarity 4.60 % (p4 4.81 %, p3_test 1.12 %)."
    source: "scripts/evaluate_phase4.py final --final --partition p6"
    artefact: "reports/experiments/phase6_final.json"
    created: "2026-11-02"
    provenance:
