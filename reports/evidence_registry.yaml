  - id: RES-009
    type: real_measured_model_result
    title: "Clean LFW, official View-2 protocol, and transfer of DigiFace thresholds"
    statement: "Official 10-fold accuracy with detector alignment (all 6,000 pairs, failures as non-match) 99.58% / 99.57% (AdaFace / ArcFace); 99.83% / 99.82% excluding the 42 failed pairs; 99.28% / 99.27% with the detector-free fixed crop. The DigiFace-calibrated FAR-1% threshold accepted 0 of 3,000 LFW impostors (conservative transfer) with FNMR 0.93% / 1.00%."
