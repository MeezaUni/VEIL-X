    notes: "Quality-shift control, not an occlusion family."

  - id: lfw
    name: "Labeled Faces in the Wild"
    url: "http://vis-www.cs.umass.edu/lfw/"
    licence: "No formal licence located. The creators state LFW was published to help research advance face verification, not to vet commercial algorithms. No grant of redistribution rights to third parties found."
    licence_source: "Official host vis-www.cs.umass.edu returns NXDOMAIN from the authoritative cs.umass.edu nameserver (checked 2026-10-27, SOA serial 2026102601); author page people.cs.umass.edu/~elm still links only to that host"
    licence_verified_on: null
    access_status: blocked
    conditions:
      - "Original authorised distribution unreachable (host removed from DNS)"
      - "Third-party mirrors (Kaggle jessicali9530/lfw-dataset, figshare via scikit-learn) have no established redistribution rights; not used (Phase 2 brief: no unauthorised mirrors)"
    identity_labels: "yes"
    n_identities: 5749
    n_images: 13233
    roles: [none]
    test_only: true
    contamination_risks: ["Celebrity identities likely in backbone pretraining data (WebFace4M is a web scrape of celebrities)"]
    notes: "Counts are the published LFW figures (13,233 images / 5,749 people). Phase 2 real-world benchmark blocked; see docs/real_world_benchmark.md for the exact user action that would unblock it."

  - id: kaggle_jessicali9530_lfw
