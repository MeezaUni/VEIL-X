# =============================================================================
# VEIL-X dataset registry — validated by src/veilx/config/schema.py (DatasetRegistry)
# Human-readable companion: docs/dataset_feasibility.md
# access_status: confirmed | conditional | unresolved | blocked
# Only "confirmed" datasets are returned by DatasetRegistry.usable_for(role).
# Nothing here has been downloaded. Sizes come from HTTP HEAD / repository metadata only.
# =============================================================================
schema_version: 1
checked_on: "2026-10-27"
datasets:
  - id: digiface1m
    name: "DigiFace-1M (Microsoft, WACV 2023)"
    url: "https://github.com/microsoft/DigiFace1M"
    licence: "Research Use of Data Agreement v1.0 (R-UDA): non-commercial research; redistribution only with attribution and R-UDA binding"
    licence_source: "https://raw.githubusercontent.com/microsoft/DigiFace1M/main/LICENSE"
    licence_verified_on: "2026-10-26"
    access_status: confirmed
    identity_labels: "yes"
    n_identities: 110000
    n_images: 1220000
    images_per_identity: "72 (IDs 0-9,999, 5 parts of 2,000) or 5 (IDs 100,000-199,998, 3 parts of ~33,333)"
    download_size: "72-img parts 2.73-2.74 GiB each; 5-img parts 3.16-3.17 GiB each; ~23.2 GiB total (HTTP HEAD, 2026-10-26)"
    roles: [train, val, cal, test_synth, visibility_training]
    test_only: false
    contamination_risks:
      - "Synthetic rendering: domain gap to real photographs"
      - "Rendered faces may resemble real people (README disclaimer)"
      - "Whether DigiFace was used to train any chosen backbone checkpoint: not verified"
    notes: "Phase 1b (2026-10-26): approved subset 72-img P1 (2,000 IDs) + 5-img P1 (33,333 IDs) downloaded and verified (310,665 images, 0 anomalies); see docs/data_integrity_report.md. Further parts not downloaded (pending approval)."

  - id: rof
    name: "Real World Occluded Faces (ROF), BIOSIG 2021"
    url: "https://github.com/ekremerakin/RealWorldOccludedFaces"
    licence: "Repository: MIT (copyright M. E. Erakin 2021). Images collected via Google Image Search; image copyright not granted by the MIT licence"
    licence_source: "https://github.com/ekremerakin/RealWorldOccludedFaces/blob/main/LICENSE"
    licence_verified_on: "2026-10-26"
    access_status: conditional
    conditions:
      - "PI/institution confirms that non-commercial academic evaluation on web-collected images of real people is ethically and legally acceptable (e.g. ethics office or supervisor sign-off)"
      - "Images ship inside pickle files: load only with a restricted unpickler in an isolated process, never plain pickle.load on untrusted data"
      - "Test-only: no tuning, threshold or design decision may use ROF"
    identity_labels: "yes"
    n_identities: 180
    n_images: 5559
    images_per_identity: "All 180 have neutral images; 70 have masked + sunglasses; 110 sunglasses only (3,195 neutral / 1,686 sunglasses / 678 masked)"
    download_size: "Repository ~4.8 MB (GitHub API size field)"
    roles: [test_real]
    test_only: true
    contamination_risks:
      - "Collected with a VGGFace2-like pipeline: identities may overlap backbone pretraining data"
      - "Small: identity-cluster CIs will be wide (180 / 70 units)"
    notes: "Primary real-occlusion test if conditions are met."

  - id: mlfw
    name: "MLFW: Masked LFW (BUPT)"
    url: "http://whdeng.cn/mlfw"
    licence: "Not retrieved (page did not render for automated fetch on 2026-10-26)"
    licence_source: "unresolved"
    licence_verified_on: null
    access_status: unresolved
    identity_labels: "yes"
    images_per_identity: "Derived from CALFW; 6,000-pair protocol reported in literature (count unverified)"
    roles: [test_real]
    test_only: true
    contamination_risks:
      - "LFW-derived celebrity identities: likely overlap with backbone pretraining data"
      - "Synthetic masks (not real occlusion)"
    notes: "Manual licence check required in a browser."

  - id: cplfw
    name: "Cross-Pose LFW (CPLFW)"
    url: "http://whdeng.cn/CPLFW/index.html"
