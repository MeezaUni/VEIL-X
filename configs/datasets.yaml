  - id: xqlfw
    name: "Cross-Quality LFW (XQLFW), FG 2021"
    url: "https://martlgap.github.io/xqlfw"
    licence: "No explicit licence on project page (checked 2026-10-26); see GitHub repo martlgap/xqlfw"
