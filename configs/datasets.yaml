    url: "https://www.kaggle.com/datasets/jessicali9530/lfw-dataset"
    licence: "Kaggle field 'Other (specified in description)'; the description specifies no licence, only acknowledgements to the LFW authors and a pointer to the original site"
    licence_source: "Kaggle API /datasets/view/jessicali9530/lfw-dataset (metadata only, no download), checked 2026-10-27"
    licence_verified_on: "2026-10-27"
    access_status: blocked
    conditions:
      - "Rights of the uploader to redistribute LFW not established; provenance not verifiable against an official checksum (official host offline)"
      - "Kaggle CLI credentials not configured on this machine (would also be required)"
    identity_labels: "yes"
    n_identities: 5749
    n_images: 13233
    download_size: "117,149,434 bytes (Kaggle totalBytes)"
    roles: [none]
    test_only: true
    contamination_risks: ["Same as lfw"]
    notes: "Resolved as the sole data source of the user-referenced notebook kaggle.com/code/vividharawat/vggface-on-lfw (Kaggle kernel metadata: datasetDataSources = [jessicali9530/lfw-dataset]). Files: lfw-deepfunneled.zip, pairs.csv, people.csv, match/mismatch DevTrain/DevTest csv, lfw_allnames.csv, lfw_readme.csv. Last updated 2018-05-17. Not downloaded."

