# =============================================================================
# VEIL-X research protocol — versioned, validated by src/veilx/config/schema.py
# Human-readable companion: docs/protocol_design.md
#
# status: provisional  -> constants may still change (each change logged in docs/decision_log.md)
# status: frozen       -> schema refuses any remaining provisional constant
# Values marked provisional were proposed by the PI on 2026-10-26 and await feasibility
# sign-off (see scripts/feasibility_report.py and docs/protocol_design.md section 7).
# =============================================================================
schema_version: 1
protocol_id: veilx-c3c1
protocol_version: 0.5.0   # changes: docs/protocol_changelog.md
status: provisional

project:
  name: VEIL-X
  usage: non-commercial-academic-research
  scope: one-to-one-verification-only

seeds:
  global_seed: 20261026
  experiment_seeds: [0, 1, 2]

backbones:
  primary:
    id: adaface_ir101_webface4m
    family: adaface
    frozen: true
    weights_licence: "Code MIT; WebFace-trained weights: no commercial use (model card / repo)"
    weights_status: not_downloaded
  secondary:
    id: arcface_iresnet_insightface
    family: arcface
    frozen: true
    weights_licence: "InsightFace pretrained models: non-commercial research only"
    weights_status: not_downloaded

detector:
  id: insightface_scrfd
  weights_licence: "InsightFace pretrained models: non-commercial research only"
  failure_policy_selective: abstain          # counted as ABSTAIN in selective metrics
  failure_policy_score: forced_non_match     # score = -inf in ROC/TAR metrics
  report_failure_rate_per_family: true

challenge_families:
  - id: F1_mask
    label: "Face masks (lower face)"
    physical_occlusion: true
    interpretation: occlusion
    real_counterparts: [rof_masked, mlfw]
  - id: F2_sunglasses
    label: "Sunglasses (upper face)"
    physical_occlusion: true
    interpretation: occlusion
    real_counterparts: [rof_sunglasses]
  - id: F3_hand_object
    label: "Hands and handheld objects"
    physical_occlusion: true
    interpretation: occlusion
    real_counterparts: []
  - id: F4_random_patch
    label: "Random geometric patches"
    physical_occlusion: true
    interpretation: occlusion
    real_counterparts: []
  - id: F5_extreme_lighting
    label: "Extreme lighting (shadow, saturation, underexposure)"
    physical_occlusion: false
    interpretation: separate_photometric      # reported and interpreted separately
    real_counterparts: []

heldout:
  scheme: leave_one_family_out
  isolation_scope:
    - feature_selection
    - model_fitting
    - threshold_selection
    - hyperparameter_optimization
    - calibration
    - visibility_estimator_training
    - occluder_asset_selection
    - deduplication_threshold_validation

splits:
  unit: identity
  hash_function: sha256
  key_template: "{dataset}:{identity_id}"
  bands:            # half-open [lo, hi) over bucket = sha256(key)[:8] mod 100
    train: [0, 60]
    val: [60, 70]
    cal: [70, 80]
    test: [80, 100]
  variants_inherit_source_split: true

pairs:
  strata:
    - clean_clean
    - clean_occluded
    - occluded_occluded_same_family
    - occluded_occluded_cross_family
  genuine_fraction_constructed_sets: 0.5
  genuine_pairs_per_identity_cap: 10      # v0.3.0: equal identity weight across DigiFace parts (D-026)
  min_impostor_pairs_factor: 10             # >= 10 / FAR impostor pairs per reported FAR
  primary_calibration_pairing: identity_disjoint_matching
  sensitivity_calibration_pairing: [one_pair_per_identity_pair, all_pairs]
  official_benchmark_pairs: report_as_is_and_separately

calibration:
  method: learn_then_test
  prediction_target: >-
    Per calibration pair the loss is 1 if the system ACCEPTS the pair (MATCH or NON-MATCH, not
    ABSTAIN) and the decision disagrees with the same-identity label. Controlled estimands
    (docs/ltt_audit.md): selective FMR = P(MATCH | accepted, impostor) and selective FNMR =
    P(NON-MATCH | accepted, genuine), each <= the accepted-decision error target; together
    they bound P(error | accepted) for ANY genuine:impostor prevalence. The score fed to the
    decision rule is the calibrated p(match) of the arm under test (raw cosine for raw-backbone
    arms). Alignment failures are abstentions.
  controlled_risk: class_conditional_selective_fmr_and_fnmr
  secondary_controlled_risks: [selective_error_among_accepted]
  candidate_ordering: validation_only
  pvalue: binomial_exact
  fwer_procedure: fixed_sequence
  lambda_grid: tau_low_tau_high_cmin
  stratification_arms: [global, visibility_strata, oracle_family]
  assumptions:
    - "A1 Exchangeability: calibration and test pairs are i.i.d. draws from the same distribution. Holds by construction only for Test-ID (seen families, disjoint identities of the same source). It does NOT hold for held-out families, real-occlusion sets (ROF) or other benchmarks."
    - "A2 Independence: calibration pairs are mutually independent. Enforced by an identity-disjoint matching (each identity appears in at most one calibration pair)."
    - "A3 Calibration isolation: the score function, fusion model, visibility estimator, quality model and lambda grid are fixed using train/val only, before the calibration data are examined."
    - "A4 Composition: the primary class-conditional estimand (sFMR and sFNMR) is prevalence-free. The secondary pooled accepted-decision error depends on the genuine:impostor mix and is certified only at the calibration prevalence, and only with Bernoulli class assignment (simulation SIM-007)."
    - "A7 Acceptance locality: whether a calibration pair is accepted depends only on that pair and the pre-specified rule; no rule parameter (thresholds, gates, strata edges, candidate order) may be estimated on calibration data."
    - "A5 Marginal validity: the guarantee is marginal over pairs, not conditional on identity, stratum or family, except per-stratum guarantees under stratified calibration, each with its own sample-size check."
    - "A6 Multiple testing: lambda values are tested in a pre-specified fixed sequence (or Bonferroni), controlling family-wise error over the grid."
  guarantee_scope_statement: >-
    Finite-sample risk control is claimed only under A1-A6, i.e. for test data exchangeable
    with the calibration data. On held-out challenge families and on real-occlusion
    benchmarks the guarantee is not claimed; the realised error versus target is measured
    and reported as an empirical outcome (hypothesis H2a).

metrics:
  primary_selective_metric: augrc
  report:
    - tar_at_far
    - roc_auc
    - eer
    - risk_coverage_curve
    - aurc
    - augrc
    - selective_fmr
    - selective_fnmr
    - coverage_overall_genuine_impostor
    - guarantee_violation_ratio
    - ece
    - brier
    - alignment_failure_rate
    - latency_p50_p95_p99
  tar_at_far_modes: [benchmark_threshold_on_test, deployment_threshold_from_cal]

bootstrap:
  unit: identity
  resamples: 2000
  paired_differences: true
  validated_by_simulation_before_use: true
  # Selected per statistic from SIM-010 (1,000 reps; nominal 95 %; acceptance: coverage >= 0.94
  # in every condition). Genuine-pair rates (FNMR/TAR): delete-one-identity jackknife on the
  # logit scale (coverage 0.948-0.957). Impostor-pair rates (FAR/FMR): delete-one-identity
  # jackknife, linear (coverage 0.960-0.975: conservative, variance over-estimated 1.6-1.9x).
  # The Phase 1a identity percentile bootstrap is NOT used for FNMR (0.935, materially below
  # nominal). Intervals for paired DIFFERENCES are not yet validated.
  interval_method_by_statistic:
    genuine_pair_rates: jackknife_logit
    impostor_pair_rates: jackknife_t
  interval_method_validation: "reports/simulations/interval_method_comparison.json (SIM-010)"

constants:
  clean_noninferiority_margin_pp:
    value: 0.5
    status: provisional
    rationale: "Max tolerated drop in clean-pair TAR@FAR=1% (percentage points) for H4."
    feasibility: "SIM-006 (synthetic): power 28%/68%/100% at 200/1,000/3,333 clean test identities; the 0.4.0 test split has 20,374 identities. Real-score check: docs/statistical_audit.md (Phase 2)."
  cost_ratio_false_match_to_false_non_match:
    value: 10
    status: frozen
    rationale: "Cost-weighted selective risk and tie-breaking among LTT-valid operating points. Approved by the PI 2026-10-26."
    feasibility: "Reporting weight only; no sample-size implication."
  confidence_level:
    value: 0.95
    status: frozen
    rationale: "1 - delta for Learn-then-Test risk control. Approved by the PI 2026-10-26."
    feasibility: "Real calibration set (0.4.0): 3,409 independent impostor + 3,409 genuine pairs (identity-disjoint, 10,227 identities)."
  accepted_decision_error_target:
    value: 0.05
    status: provisional
    rationale: "Initial target for error among accepted decisions (controlled risk)."
    feasibility: "Certifiable with identity-disjoint DigiFace calibration sets; see report section B/C."
  far_operating_points:
    value: [0.01, 0.001]
    status: frozen
    rationale: "Operating points for TAR@FAR and selective FMR reporting. FAR 0.1% is ESTIMATION-ONLY (PI decision 2026-10-26)."
    feasibility: "Real calibration set (0.4.0): 3,409 independent impostor pairs -> best certifiable sFMR 0.088% (0 FM at full coverage), so 1% is certifiable and 0.1% only with zero false matches (kept estimation-only); test FAR-estimation set: 100,000 impostor pairs over 20,373 identities."
  bootstrap_ci_level:
    value: 0.95
    status: frozen
    rationale: "Two-sided 95% intervals with the identity as resampling/deletion unit; methods per statistic in bootstrap.interval_method_by_statistic."
    feasibility: "SIM-010: selected methods cover >= 0.948 (genuine rates) and >= 0.960 (impostor rates, conservative) in every simulated condition."

deduplication:
  exact: sha256_of_decoded_pixels
  near_duplicate:
    # v0.3.0: no face-embedding signal. Validation on DigiFace train/val (2026-10-26) FAILED the
    # acceptance criteria (the 99%-recall rule flags 2.95% of same-identity photos), and even a
    # strict review rule nominates 676,350 non-duplicate pairs (base-rate effect on aligned
    # synthetic renders). Threshold therefore stays UNSET; only exact pixel duplicates (0 found)
    # are removed. See docs/data_integrity_report.md.
    method: phash_hamming_and_thumbnail_ncc
    threshold: null
    ncc_min: null
    validated_on_split: null
    validation_record: null
    target_duplicate_recall:
      value: 0.99
      status: provisional
      rationale: "Recall on synthetic known-duplicate positives built from train/val images."
  removal_side: non_test

test_access:
  require_final_flag: true
  run_log: results/test_runs.jsonl
  real_benchmarks_final_only: true

# =============================================================================
# v0.3.0 real-data sections (Phase 1b). Aggregated, non-identifying values only.
# =============================================================================
data_preparation:
  dataset_id: digiface1m
  parts: [subjects_0-1999_72_imgs, subjects_100000-133332_5_imgs, subjects_133333-166665_5_imgs, subjects_166666-199998_5_imgs]
  archive_sha256:
    subjects_0-1999_72_imgs.zip: 29c5347f2287637c646eee7a760cbc392763ecd804e7bb5a9ba6d557fa94f9b3
    subjects_100000-133332_5_imgs.zip: 998253e11e8c3cca20e92fd51a6b6a40dd6661344ee6c0a2e46a8586cd84f641
    subjects_133333-166665_5_imgs.zip: 1d99a9512366cbe0b2f51ee19ef847d76adde3fd42097b7aa4c274316b980701
    subjects_166666-199998_5_imgs.zip: a70f53ae6306ad1266491f2314dffcbd69a1c6cba10b63cc63eb15e248a28606
  archive_bytes:
    subjects_0-1999_72_imgs.zip: 2938553163
    subjects_100000-133332_5_imgs.zip: 3399664847
    subjects_133333-166665_5_imgs.zip: 3398240548
    subjects_166666-199998_5_imgs.zip: 3400932852
  checksum_source: "No published checksum. Size equals the official host's Content-Length; every member passed zip CRC-32; SHA-256 recorded at first download (trust-on-first-download fingerprint, not an authenticity proof)."
  image_size: [112, 112]
  alignment: "All images 112x112 RGBA with alpha=255 everywhere (alpha dropped losslessly). Mean of 1,000 random images aligns with the ArcFace 5-point template (visual check); landmark-free template placement is therefore used for occlusions."
  # 0.4.0: all 310,665 Phase 1b images keep their split and pixel hash (verified)
  images_scanned: 643995
  images_final: 643995
  identities_final: 101999
  identities_per_split: {train: 61067, val: 10329, cal: 10229, test: 20374}
  images_per_split: {train: 382921, val: 65380, cal: 64612, test: 131082}
  # 0.4.0 (D-038): caps per pair set; equal per-identity weight inside each set
  genuine_pairs_per_identity_cap: {train: 10, val: 3, test_balanced: 3}
  far_estimation_impostor_pairs: 100000
  # 0.4.0 (D-038): train-role plans deferred to Phase 3; test_far is a clean-only FAR set
  occlusion_plan_sets: ["val:val", "cal:cal_independent", "test_id:test_balanced", "test_ood:test_balanced"]
  stress_max_pairs: 20000   # combined occlusions: exploratory subsample of test_balanced
  summary_report: reports/data/digiface_v0.4.0_summary.json

occlusion:
  generator_version: occl-1.0.0
  landmark_source: arcface_template
  severity_levels: [low, medium, high]
  severity_definition: "Fraction of the face region (ellipse around the 5 template landmarks, brows to chin) covered by the ground-truth mask."
  visibility_definition: "1 - severity over the same face region; recorded per sample with the 7x7 grid available via veilx.occlusion.visibility_grid."
  level_parameters:
    F1_mask: "top edge below nose / across nose / up to under the eyes (low/medium/high)"
    F2_sunglasses: "lens radius 0.30 / 0.38 / 0.48 x inter-ocular distance"
    F3_hand_object: "blob radius 0.40 / 0.62 / 0.85 x inter-ocular distance; 60% hand-like"
    F4_random_patch: "target face coverage 10-22% / 25-42% / 45-65%"
    F5_extreme_lighting: "shadow factor 0.55/0.35/0.15, under-exposure gain 0.35/0.22/0.12, over-exposure gain 1.8/2.6/3.6"
  lighting_note: "F5 is photometric, not a physical occlusion: its mask marks destroyed pixels (crushed, clipped or darkened to <=35%); it is reported and interpreted separately."
  stress_combinations: [F1_mask+F2_sunglasses, F1_mask+F3_hand_object, F2_sunglasses+F4_random_patch, F3_hand_object+F4_random_patch]

calibration_plan:
  pairing: identity_disjoint_matching
  calibration_identities: 10229
  independent_genuine_pairs: 3409
  independent_impostor_pairs: 3409
  best_certifiable_fmr_zero_errors: 0.000878
  note: "0.4.0: 1% selective FMR certifiable (<= 24 false matches at full coverage); 0.1% would need >= 2,995 accepted impostors with ZERO false matches, so it stays estimation-only (D-034). Per visibility stratum (delta/3) 0.1% is never certifiable. reports/data/capacity_v0.4.0.json"

# =============================================================================
# v0.5.0 Phase 3 prospective protocol (frozen before any Phase 3 training).
# Human-readable: docs/phase3_protocol.md
# =============================================================================
phase3:
  protocol_doc: docs/phase3_protocol.md
  population_split: train          # identities never scored by any model in Phases 1-2 (verified)
  subsplit_salt: "veilx-p3"
  subsplit_bands: {p3_train: [0, 50], p3_val: [50, 60], p3_cal: [60, 75], p3_test: [75, 100]}
  seed: 20261027
  ordering_default: v2_validation_pvalue
  ordering_comparison: v1_validation_risk
  confirmatory_set: p3_test
  followup_sets: [phase2_digiface_test, lfw_view2_derived_occlusion]
  holm_families: {c3_risk_folds: 5, c1_logloss_cells: 10}
  ve_grid: 28
  ve_max_epochs: 30
  ve_patience: 4
