# Phase 3 visibility estimator, held-out family F4_random_patch (docs/phase3_protocol.md section 3).
# Authorised by the project owner (D-046); launching also requires VEILX_PHASE2_AUTHORIZED=1.
schema_version: 1
run_id: p3-ve-f4-random-patch
phase: phase3
authorized: true
purpose: "Train the lightweight visibility estimator without the held-out family F4_random_patch."
seed: 20261027
device: cuda
backbone_id: none-visibility-estimator
