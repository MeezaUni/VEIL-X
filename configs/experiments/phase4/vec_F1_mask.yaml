# Phase 4 conservative visibility estimator VE-C, held-out family F1_mask (docs/phase4_protocol.md 4.2).
# Authorised by the project owner (D-048); launching also requires VEILX_PHASE2_AUTHORIZED=1.
# One registered configuration per fold; no hyperparameter search.
schema_version: 1
run_id: p4-vec-f1-mask
phase: phase4
authorized: true
purpose: "Train the conservative visibility estimator VE-C without the held-out family F1_mask."
seed: 20261101
device: cuda
backbone_id: none-visibility-estimator
backbone_frozen: true
heldout_family: F1_mask
train_pairs: manifests/phase3/subsplits.json#p3_train
val_pairs: manifests/phase3/subsplits.json#p3_val
batch_size: 128
grad_accumulation: 1
max_epochs: 30
learning_rate: 0.001
precision:
  mode: fp16
  allow_tf32: false
  deterministic: true
checkpoint:
  directory: models/phase4/vec/F1_mask
  keep_last: 2
  save_every_steps: 1
visibility:
  occluded_weight: 4.0
  hard_negative_fraction: 0.2
  lighting_as_corruption: true
